<title>TubeCoach — Your YouTube Growth Assistant</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#FF3B3B;--red-dark:#CC2020;--red-glow:rgba(255,59,59,0.18);
  --bg:#0A0A0A;--bg2:#111111;--bg3:#1A1A1A;--bg4:#222222;
  --text:#F5F5F0;--text2:#A0A09A;--text3:#606058;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --green:#22C55E;--amber:#F59E0B;--blue:#3B82F6;
  --radius:12px;--radius-lg:18px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;overflow-x:hidden}
#root{min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.5}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 20px var(--red-glow)}50%{box-shadow:0 0 40px var(--red-glow),0 0 80px rgba(255,59,59,0.08)}}
.fade-up{animation:fadeUp .5s ease forwards}.fade-up-d1{animation:fadeUp .5s .1s ease both}.fade-up-d2{animation:fadeUp .5s .2s ease both}.fade-up-d3{animation:fadeUp .5s .3s ease both}.fade-up-d4{animation:fadeUp .5s .4s ease both}.fade-up-d5{animation:fadeUp .5s .5s ease both}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:var(--radius);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;transition:all .18s ease}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-dark);transform:translateY(-1px);box-shadow:0 8px 24px var(--red-glow)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg4)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-red{background:rgba(255,59,59,.12);color:#FF6B6B;border:1px solid rgba(255,59,59,.2)}
.tag-green{background:rgba(34,197,94,.1);color:#4ADE80;border:1px solid rgba(34,197,94,.2)}
.tag-amber{background:rgba(245,158,11,.1);color:#FCD34D;border:1px solid rgba(245,158,11,.2)}
.tag-blue{background:rgba(59,130,246,.1);color:#60A5FA;border:1px solid rgba(59,130,246,.2)}
.divider{height:1px;background:var(--border);margin:20px 0}
input,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;width:100%;outline:none;transition:border-color .18s}
input:focus,textarea:focus{border-color:var(--red)}
input::placeholder,textarea::placeholder{color:var(--text3)}
label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.progress-track{background:var(--bg3);border-radius:20px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;background:var(--red);transition:width .6s ease}
.error-box{background:rgba(255,59,59,.08);border:1px solid rgba(255,59,59,.2);border-radius:var(--radius);padding:14px 16px;font-size:13px;color:#FF6B6B;margin-bottom:16px}
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:0}
.sidebar-logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text);margin-bottom:28px;padding:0 8px;display:flex;align-items:center;gap:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text2);transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg3);color:var(--text)}.nav-item.active{background:rgba(255,59,59,.1);color:var(--red);font-weight:500}
.sidebar-bottom{margin-top:auto}
.avatar-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);background:var(--bg3)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.main{margin-left:220px;padding:32px;min-height:100vh;max-width:1100px}
.page-header{margin-bottom:32px}.page-header h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:700}.page-header p{color:var(--text2);margin-top:4px;font-size:14px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-label{font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-family:'Syne',sans-serif;font-size:24px;font-weight:700}.stat-delta{font-size:12px;margin-top:4px}
.stat-delta.up{color:var(--green)}.stat-delta.down{color:var(--red)}
.action-plan{display:grid;grid-template-columns:1fr 320px;gap:20px}
.task-list{display:flex;flex-direction:column;gap:10px}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s}
.task-item:hover{border-color:var(--border2)}.task-item.done{opacity:.5}.task-item.done .task-title{text-decoration:line-through}
.task-checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.task-checkbox.checked{background:var(--red);border-color:var(--red)}
.task-title{font-size:14px;font-weight:500;color:var(--text);line-height:1.4}.task-meta{font-size:12px;color:var(--text3);margin-top:3px}
.msg{display:flex;gap:10px;max-width:100%}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.msg-ai .msg-avatar{background:var(--red);color:#fff}.msg-user .msg-avatar{background:var(--bg4);color:var(--text2)}
.msg-bubble{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;max-width:calc(100% - 40px)}
.msg-ai .msg-bubble{background:var(--bg3);border:1px solid var(--border)}.msg-user .msg-bubble{background:rgba(255,59,59,.12);border:1px solid rgba(255,59,59,.2);margin-left:auto}
.msg-user{flex-direction:row-reverse}
.chat-input-row{display:flex;gap:10px;margin-top:16px}.chat-input-row input{flex:1}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:pulse 1s ease infinite}
.typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
.onboard-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.onboard-card{width:100%;max-width:540px}
.step-pills{display:flex;gap:6px;margin-bottom:32px}
.step-pill{height:4px;border-radius:4px;flex:1;background:var(--bg3);transition:background .3s}
.step-pill.done{background:var(--red)}.step-pill.active{background:var(--red);opacity:.5}
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative;overflow:hidden}
.landing-glow{position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(255,59,59,.12) 0%,transparent 70%);pointer-events:none}
.landing h1{font-family:'Syne',sans-serif;font-size:clamp(36px,6vw,72px);font-weight:800;line-height:1.05;letter-spacing:-2px;margin-bottom:20px}
.landing h1 em{font-style:normal;color:var(--red)}
.landing-sub{font-size:16px;color:var(--text2);max-width:460px;margin:0 auto 36px;line-height:1.7}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:32px;width:100%;max-width:400px;margin:0 auto}
.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 20px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--text);transition:all .18s}
.google-btn:hover{background:var(--bg4);transform:translateY(-1px)}
.guide-step{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}.guide-step:last-child{border-bottom:none}
.step-num{width:28px;height:28px;border-radius:50%;background:rgba(255,59,59,.1);border:1px solid rgba(255,59,59,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--red);flex-shrink:0}
.section-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.idea-chip{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:8px}
.trend-bar{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.trend-bar:last-child{border-bottom:none}
.trend-name{font-size:13px;color:var(--text);flex:1}.trend-score{font-size:12px;color:var(--text3);width:32px;text-align:right}
.trend-mini-bar{flex:1;max-width:80px;height:4px;background:var(--bg4);border-radius:4px;overflow:hidden}
.trend-mini-fill{height:100%;background:var(--red);border-radius:4px}
.goal-ring{position:relative;width:120px;height:120px;margin:0 auto 20px}
.goal-ring svg{transform:rotate(-90deg)}
.goal-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.goal-ring-pct{font-family:'Syne',sans-serif;font-size:22px;font-weight:700}.goal-ring-sub{font-size:10px;color:var(--text3)}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;background:var(--bg4)}.bar.highlight{background:var(--red)}
.bar-label{font-size:10px;color:var(--text3)}
.full-loader{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.full-loader p{color:var(--text2);font-size:14px}
</style>
</head>
<body>

<script>
const {useState,useEffect,useRef}=React;

/* ══════════════════════════════════════════════

const API='http://localhost:4000';

/* ── Token helpers ── */
const getToken=()=>localStorage.getItem('tc_token');
const setToken=t=>localStorage.setItem('tc_token',t);
const clearToken=()=>localStorage.removeItem('tc_token');

/* ── API helper — adds auth header automatically ── */
async function api(path,opts={}){
  const token=getToken();
  const res=await fetch(API+path,{
    headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})},
    ...opts,
    body:opts.body?JSON.stringify(opts.body):undefined,
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Something went wrong');
  return data;
}

/* ── Icons ── */
const Icon=({d,size=16,stroke='currentColor',fill='none',sw=1.5})=>

    React.createElement('path',{d}));
const ic={

  yt:'M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 00-1.95 1.96A29 29 0 001 12a29 29 0 00.46 5.58 2.78 2.78 0 001.95 1.95C5.12 20 12 20 12 20s6.88 0 8.59-.47a2.78 2.78 0 001.95-1.95A29 29 0 0023 12a29 29 0 00-.46-5.58zM9.75 15.02V8.98l5.75 3.02z',

/* ══════════════ LANDING ══════════════ */
function Landing({onLogin,onNewUser}){
  return React.createElement('div',{className:'landing'},
    React.createElement('div',{className:'landing-glow'}),
    React.createElement('div',{className:'fade-up',style:{marginBottom:12}},
      React.createElement('span',{className:'tag tag-red'},React.createElement(Icon,{d:ic.spark,size:12}),' AI-Powered Growth')),
    React.createElement('h1',{className:'fade-up-d1'},'Grow your YouTube\n',React.createElement('em',null,'10x faster'),'\nwith AI'),

          React.createElement('path',{d:'M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z',fill:'#34A853'}),
          React.createElement('path',{d:'M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z',fill:'#FBBC05'}),
          React.createElement('path',{d:'M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z',fill:'#EA4335'})
        ),'Continue with Google'),

/* ══════════════ GUIDE ══════════════ */
function GuidePage({onBack,onLogin}){
  const steps=[
    {title:'Go to youtube.com and sign in',desc:'Use your Google account to sign in to YouTube.'},
    {title:'Click your profile icon → "Create a channel"',desc:"You'll see an option to create a personal or custom-name channel."},

  ];
  return React.createElement('div',{className:'onboard-wrap'},
    React.createElement('div',{className:'onboard-card'},

      React.createElement('span',{className:'tag tag-blue',style:{marginBottom:16}},React.createElement(Icon,{d:ic.yt,size:12}),' Channel Setup Guide'),

}

/* ══════════════ ONBOARDING ══════════════ */
function Onboarding({onDone}){
  const [step,setStep]=useState(0);
  const [form,setForm]=useState({niche:'',lang:'',goal:'',freq:'',goalNumber:10000});
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const niches=['Tech Reviews','Gaming','Cooking','Fitness','Finance','Education','Comedy','Vlogs','Beauty','Other'];
  const langs=['Tamil','Telugu','Hindi','Kannada','Malayalam','English','Bengali'];
  const goals=[{l:'1,000 subscribers',n:1000},{l:'10,000 subscribers',n:10000},{l:'1,00,000 subscribers',n:100000},{l:'Monetization (4K hrs + 1K subs)',n:1000},{l:'Brand deals',n:10000}];
  const freqs=['1 video/week','2 videos/week','3-4 videos/week','Daily'];
  const canNext=(step===0&&form.niche&&form.lang)||(step===1&&form.goal)||(step===2&&form.freq);

  async function finish(){
    setLoading(true);setError('');
    try{
      await api('/dashboard/onboard',{method:'POST',body:{niche:form.niche,lang:form.lang,goal:form.goal,freq:form.freq,goalNumber:form.goalNumber}});
      onDone();
    }catch(e){setError(e.message);setLoading(false);}
  }

  return React.createElement('div',{className:'onboard-wrap'},
    React.createElement('div',{className:'onboard-card'},
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:28}},
        React.createElement(Icon,{d:ic.yt,size:22,stroke:'var(--red)',sw:2}),

              razorpay_order_id:response.razorpay_order_id,
              razorpay_payment_id:response.razorpay_payment_id,
              razorpay_signature:response.razorpay_signature,
              amount:order.amount/100,plan:order.plan
            }}).then(function(){ setLoading(false); onContinue(); })
            .catch(function(e){ setErr('Verification failed: '+e.message); setLoading(false); });
          },
          modal:{ondismiss:function(){ setLoading(false); }}
        };
        var load=function(){ new window.Razorpay(options).open(); };
        if(!window.Razorpay){ var s=document.createElement('script'); s.src='https://checkout.razorpay.com/v1/checkout.js'; s.onload=load; document.body.appendChild(s); }
        else { load(); }
      }).catch(function(e){ setErr(e.message); setLoading(false); });
  }

  return h('div',{className:'land'},
    h('div',{className:'lglow'}),
    h('div',{style:{maxWidth:520,width:'100%'}},
      h('div',{className:'fade-up',style:{textAlign:'center',marginBottom:24}},
        h('span',{className:'tag tag-green',style:{marginBottom:12}},h(Icon,{d:ic.spark,size:12}),' Special Launch Offer'),
        h('h1',{style:{fontFamily:'Syne',fontSize:28,fontWeight:800,letterSpacing:-1,marginBottom:6}},'Welcome, '+firstName+'!'),
        h('p',{style:{color:'var(--text2)',fontSize:14,lineHeight:1.7}},'Start free. Pay only when you love it.')),
      h('div',{className:'fade-up-d1',style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:16}},
        tiers.map(function(t,i){
          return h('div',{key:i,style:{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'14px 10px',textAlign:'center'}},
            h('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:6}},t.month),
            h('div',{style:{fontFamily:'Syne',fontSize:20,fontWeight:800,color:t.color,marginBottom:6}},t.price),
            h('span',{className:'tag '+t.cls,style:{fontSize:10}},t.tag));
        })),
      pricing?h('div',{className:'fade-up-d1',style:{background:'rgba(34,197,94,.06)',border:'1px solid rgba(34,197,94,.15)',borderRadius:'var(--radius)',padding:'10px 14px',marginBottom:14,display:'flex',alignItems:'center',gap:8}},
        h('span',{style:{fontSize:16}},'Your plan: '),
        h('span',{style:{fontSize:13,fontWeight:600,color:'var(--green)'}},
          inTrial?'Month 1 FREE - '+(pricing.trialDaysLeft||30)+' days left':'Next: '+(pricing.label||'Rs.49/month'))):null,
      h('div',{className:'card fade-up-d2'},
        h('div',{className:'sectitle',style:{marginBottom:14}},'Everything included'),
        features.map(function(f,i){
          return h('div',{key:i,style:{display:'flex',gap:10,marginBottom:10,fontSize:13}},
            h(Icon,{d:ic.check,size:14,stroke:'var(--green)',sw:2.5}),
            h('span',{style:{color:'var(--text2)'}},f));
        }),
        h('div',{className:'divider'}),
        err?h('div',{className:'err'},err):null,
        inTrial
          ?h('button',{className:'btn btn-primary',style:{width:'100%',justifyContent:'center',padding:'13px',fontSize:14},onClick:onContinue},
              h(Icon,{d:ic.spark,size:14,stroke:'#fff'}),' Enter dashboard - free for '+(pricing?pricing.trialDaysLeft:30)+' days')
          :h('button',{className:'btn btn-primary',style:{width:'100%',justifyContent:'center',padding:'13px',fontSize:14},onClick:pay,disabled:loading||!pricing},
              loading?h('div',{className:'spinner'}):null,
              loading?'Processing...':(pricing?'Pay '+(pricing.label||'Rs.49')+' - Get full access':'Loading...')),
        h('p',{style:{textAlign:'center',fontSize:12,color:'var(--text3)',marginTop:10}},'UPI - Cards - Net banking - Cancel anytime'))));
}

/* ══════════════ DASHBOARD ══════════════ */
function Dashboard({user,onLogout}){
  const [tab,setTab]=useState('plan');
  const content={
    plan:React.createElement(PlanTab,{user}),
    analysis:React.createElement(AnalysisTab,{user}),
    chat:React.createElement(ChatTab,{user}),
    goal:React.createElement(GoalTab,{user}),
  };
  return React.createElement('div',null,
    React.createElement(Sidebar,{tab,setTab,user,onLogout}),
    React.createElement('div',{className:'main'},content[tab]));
}

/* ══════════════ APP — handles auth state ══════════════ */
function App(){
  const [screen,setScreen]=useState('loading');
  const [user,setUser]=useState(null);

  useEffect(()=>{
    // Check if Google OAuth just redirected back with a token
    const params=new URLSearchParams(window.location.search);
    const token=params.get('token');
    if(token){
      setToken(token);
      window.history.replaceState({},'',window.location.pathname);
    }

    const saved=getToken();
    if(!saved){setScreen('landing');return;}

    // Verify token with backend and get user data
    api('/auth/verify',{method:'POST',body:{token:saved}})
      .then(u=>{
        setUser(u);
        if(!u.onboarded)setScreen('onboard');
        else if(!u.isPremium&&!u.trialActive)setScreen('paywall');
        else setScreen('dashboard');
      })
      .catch(()=>{clearToken();setScreen('landing');});
  },[]);

  function handleLogin(){
    // This redirects to backend → Google → back to this page with ?token=xxx
    window.location.href=`${API}/auth/google`;
  }

  function handleLogout(){
    clearToken();setUser(null);setScreen('landing');
  }

  async function handleOnboardDone(){
    const u=await api('/auth/verify',{method:'POST',body:{token:getToken()}});
    setUser(u);setScreen('paywall');
  }

  if(screen==='loading')   return React.createElement(FullLoader,{text:'Loading TubeCoach…'});
  if(screen==='landing')   return React.createElement(Landing,{onLogin:handleLogin,onNewUser:()=>setScreen('guide')});
  if(screen==='guide')     return React.createElement(GuidePage,{onBack:()=>setScreen('landing'),onLogin:handleLogin});
  if(screen==='onboard')   return React.createElement(Onboarding,{user,onDone:handleOnboardDone});
  if(screen==='paywall')   return React.createElement(Paywall,{user,onContinue:()=>setScreen('dashboard')});
  if(screen==='dashboard') return React.createElement(Dashboard,{user,onLogout:handleLogout});
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

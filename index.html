<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AITube — AI-Powered YouTube Growth</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#FF3B3B;--red-dark:#CC2020;--red-glow:rgba(255,59,59,0.18);
  --bg:#0A0A0A;--bg2:#111111;--bg3:#1A1A1A;--bg4:#222222;
  --text:#F5F5F0;--text2:#A0A09A;--text3:#606058;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --green:#22C55E;--amber:#F59E0B;--blue:#3B82F6;
  --radius:12px;--radius-lg:18px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;overflow-x:hidden;overflow-y:hidden;position:fixed;width:100%}
#root{height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#root{min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.5}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 20px var(--red-glow)}50%{box-shadow:0 0 40px var(--red-glow),0 0 80px rgba(255,59,59,0.08)}}
.fade-up{animation:fadeUp .5s ease forwards}.fade-up-d1{animation:fadeUp .5s .1s ease both}.fade-up-d2{animation:fadeUp .5s .2s ease both}.fade-up-d3{animation:fadeUp .5s .3s ease both}.fade-up-d4{animation:fadeUp .5s .4s ease both}.fade-up-d5{animation:fadeUp .5s .5s ease both}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:var(--radius);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;transition:all .18s ease}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-dark);transform:translateY(-1px);box-shadow:0 8px 24px var(--red-glow)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg4)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-red{background:rgba(255,59,59,.12);color:#FF6B6B;border:1px solid rgba(255,59,59,.2)}
.tag-green{background:rgba(34,197,94,.1);color:#4ADE80;border:1px solid rgba(34,197,94,.2)}
.tag-amber{background:rgba(245,158,11,.1);color:#FCD34D;border:1px solid rgba(245,158,11,.2)}
.tag-blue{background:rgba(59,130,246,.1);color:#60A5FA;border:1px solid rgba(59,130,246,.2)}
.divider{height:1px;background:var(--border);margin:20px 0}
input,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;width:100%;outline:none;transition:border-color .18s}
input:focus,textarea:focus{border-color:var(--red)}
input::placeholder,textarea::placeholder{color:var(--text3)}
label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.progress-track{background:var(--bg3);border-radius:20px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;background:var(--red);transition:width .6s ease}
.error-box{background:rgba(255,59,59,.08);border:1px solid rgba(255,59,59,.2);border-radius:var(--radius);padding:14px 16px;font-size:13px;color:#FF6B6B;margin-bottom:16px}
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:0}
.sidebar-logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text);margin-bottom:28px;padding:0 8px;display:flex;align-items:center;gap:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text2);transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg3);color:var(--text)}.nav-item.active{background:rgba(255,59,59,.1);color:var(--red);font-weight:500}
.sidebar-bottom{margin-top:auto}
.avatar-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);background:var(--bg3)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.main{margin-left:220px;padding:32px;min-height:100vh;max-width:1100px}
.page-header{margin-bottom:32px}.page-header h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:700}.page-header p{color:var(--text2);margin-top:4px;font-size:14px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-label{font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-family:'Syne',sans-serif;font-size:24px;font-weight:700}.stat-delta{font-size:12px;margin-top:4px}
.stat-delta.up{color:var(--green)}.stat-delta.down{color:var(--red)}
.action-plan{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.task-list{display:flex;flex-direction:column;gap:10px}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s}
.task-item:hover{border-color:var(--border2)}.task-item.done{opacity:.5}.task-item.done .task-title{text-decoration:line-through}
.task-checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.task-checkbox.checked{background:var(--red);border-color:var(--red)}
.task-title{font-size:14px;font-weight:500;color:var(--text);line-height:1.4}.task-meta{font-size:12px;color:var(--text3);margin-top:3px}
.msg{display:flex;gap:10px;max-width:100%}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.msg-ai .msg-avatar{background:var(--red);color:#fff}.msg-user .msg-avatar{background:var(--bg4);color:var(--text2)}
.msg-bubble{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;max-width:calc(100% - 40px)}
.msg-ai .msg-bubble{background:var(--bg3);border:1px solid var(--border)}.msg-user .msg-bubble{background:rgba(255,59,59,.12);border:1px solid rgba(255,59,59,.2);margin-left:auto}
.msg-user{flex-direction:row-reverse}
.chat-input-row{display:flex;gap:10px;margin-top:16px}.chat-input-row input{flex:1}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:pulse 1s ease infinite}
.typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
.onboard-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.onboard-card{width:100%;max-width:540px}
.step-pills{display:flex;gap:6px;margin-bottom:32px}
.step-pill{height:4px;border-radius:4px;flex:1;background:var(--bg3);transition:background .3s}
.step-pill.done{background:var(--red)}.step-pill.active{background:var(--red);opacity:.5}
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative;overflow:hidden}
.landing-glow{position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(255,59,59,.12) 0%,transparent 70%);pointer-events:none}
.landing h1{font-family:'Syne',sans-serif;font-size:clamp(36px,6vw,72px);font-weight:800;line-height:1.05;letter-spacing:-2px;margin-bottom:20px}
.landing h1 em{font-style:normal;color:var(--red)}
.landing-sub{font-size:16px;color:var(--text2);max-width:460px;margin:0 auto 36px;line-height:1.7}
.login-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:32px;width:100%;max-width:400px;margin:0 auto}
.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 20px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--text);transition:all .18s}
.google-btn:hover{background:var(--bg4);transform:translateY(-1px)}
.guide-step{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}.guide-step:last-child{border-bottom:none}
.step-num{width:28px;height:28px;border-radius:50%;background:rgba(255,59,59,.1);border:1px solid rgba(255,59,59,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--red);flex-shrink:0}
.section-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.idea-chip{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:8px}
.trend-bar{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.trend-bar:last-child{border-bottom:none}
.trend-name{font-size:13px;color:var(--text);flex:1}.trend-score{font-size:12px;color:var(--text3);width:32px;text-align:right}
.trend-mini-bar{flex:1;max-width:80px;height:4px;background:var(--bg4);border-radius:4px;overflow:hidden}
.trend-mini-fill{height:100%;background:var(--red);border-radius:4px}
.goal-ring{position:relative;width:120px;height:120px;margin:0 auto 20px}
.goal-ring svg{transform:rotate(-90deg)}
.goal-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.goal-ring-pct{font-family:'Syne',sans-serif;font-size:22px;font-weight:700}.goal-ring-sub{font-size:10px;color:var(--text3)}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;background:var(--bg4)}.bar.highlight{background:var(--red)}
.bar-label{font-size:10px;color:var(--text3)}
.full-loader{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
.skeleton-text{height:14px;margin-bottom:8px}
.skeleton-title{height:20px;margin-bottom:12px}
.skeleton-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:12px}
.full-loader p{color:var(--text2);font-size:14px}

/* ══ AITUBE — YouTube-inspired mobile UI ══ */
/* Mobile header - like YouTube */
.mobile-header{
  display:none;
  position:fixed;top:0;left:0;right:0;
  background:var(--bg);border-bottom:1px solid var(--border);
  padding:12px 16px;z-index:100;
  align-items:center;justify-content:space-between;
  height:56px;
}
.mobile-header-logo{
  font-family:'Syne',sans-serif;font-size:20px;font-weight:800;
  display:flex;align-items:center;gap:6px;
}
.mobile-header-logo span.ai{color:var(--text)}
.mobile-header-logo span.tube{color:var(--red)}
.mobile-avatar-btn{
  width:32px;height:32px;border-radius:50%;
  background:var(--red);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;overflow:hidden;
}
.mobile-avatar-btn img{width:100%;height:100%;object-fit:cover}

/* ══ MOBILE RESPONSIVE ══ */
@media(max-width:768px){
  /* Show mobile header, hide sidebar */
  .sidebar{display:none}
  .mobile-header{display:flex!important}
  .mobile-nav{display:flex!important}

  /* Main content with header + bottom nav spacing */
  .main{margin-left:0;padding:72px 12px 76px;max-width:100%}

  /* Landing page */
  .landing{padding:24px 16px}
  .landing h1{font-size:clamp(26px,8vw,40px);letter-spacing:-1px;margin-bottom:14px}
  .landing-sub{font-size:13px;margin-bottom:24px}
  .login-card{padding:20px;border-radius:16px}
  .google-btn{padding:13px 16px;font-size:14px}

  /* Onboarding */
  .onboard-wrap{padding:72px 16px 16px;align-items:flex-start}
  .onboard-card{padding:0}

  /* Stats grid - 2 columns on mobile */
  .stats-grid{grid-template-columns:1fr 1fr!important;gap:10px;margin-bottom:16px}
  .stat-card{padding:12px}
  .stat-value{font-size:20px}

  /* Action plan - single column */
  .action-plan{grid-template-columns:1fr!important;gap:12px}

  /* Task items - YouTube-like row cards */
  .task-item{
    padding:12px;border-radius:12px;
    background:var(--bg2);
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .task-title{font-size:13px}
  .task-meta{font-size:11px}

  /* Cards */
  .card{padding:14px;border-radius:14px;margin-bottom:12px}
  .card-sm{padding:12px;border-radius:10px}

  /* Page header - compact */
  .page-header{margin-bottom:16px}
  .page-header h1{font-size:18px;font-weight:700}
  .page-header p{font-size:12px}

  /* Goal tracker */
  .goal-grid{grid-template-columns:1fr!important;gap:12px}

  /* Chat */
  .chat-grid{grid-template-columns:1fr!important}
  .chat-suggestions{display:none}
  .card[style*='height:560']{height:calc(100vh - 200px)!important}

  /* Roadmap - 2 cols on mobile */
  .roadmap-grid{grid-template-columns:1fr 1fr!important;gap:8px}

  /* Paywall tiers */
  .paywall-tiers{grid-template-columns:1fr!important;gap:8px}

  /* Analysis — AI insight full width on mobile */
  .analysis-grid{grid-template-columns:1fr!important}

  /* Plan layout — stack on mobile */
  .plan-outer{flex-direction:column!important}
  .plan-right-panel{width:100%!important;margin-top:14px}

  /* Hide scrollbar on mobile */
  #root::-webkit-scrollbar{display:none}
  #root{-ms-overflow-style:none;scrollbar-width:none}
  *::-webkit-scrollbar{display:none}
  *{-ms-overflow-style:none;scrollbar-width:none}

  /* Section titles smaller */
  .section-title{font-size:12px;margin-bottom:10px}

  /* Tags smaller */
  .tag{font-size:11px;padding:2px 8px}

  /* Trend bars */
  .trend-bar{padding:8px 0}
  .trend-name{font-size:12px}
}

/* Mobile bottom navigation */
.mobile-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg2);border-top:1px solid var(--border);
  padding:8px 0 env(safe-area-inset-bottom,8px);
  z-index:100;
  justify-content:space-around;align-items:center;
}
.mobile-nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 16px;border:none;background:none;cursor:pointer;
  color:var(--text3);font-family:'DM Sans',sans-serif;font-size:10px;
  transition:color .15s;
}
.mobile-nav-item.active{color:var(--red)}
.mobile-nav-item svg{width:20px;height:20px}
</style>
</head>

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script>
const {useState,useEffect,useRef}=React;

/* ══════════════════════════════════════════════
   CHANGE THIS if your backend URL is different
   ══════════════════════════════════════════════ */
const API=(function(){var h=window.location.hostname;if(h==='localhost'&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()))return 'http://localhost:4000';return 'https://tubecoach-frontend.vercel.app/api';})();

/* ── Token helpers ── */
const getToken=()=>localStorage.getItem('tc_token');
const setToken=t=>localStorage.setItem('tc_token',t);
const clearToken=()=>localStorage.removeItem('tc_token');

/* ── API helper — adds auth header automatically ── */
async function api(path,opts={}){
  const token=getToken();
  const res=await fetch(API+path,{
    headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})},
    ...opts,
    body:opts.body?JSON.stringify(opts.body):undefined,
  });
  const text=await res.text();
  console.log('[API]',path,'status:',res.status,'body:',text.substring(0,200));
  let data;
  try{data=JSON.parse(text);}catch(e){throw new Error('Invalid response: '+text.substring(0,100));}
  if(!res.ok)throw new Error(data.error||'HTTP '+res.status);
  return data;
}

/* ── Icons ── */
const Icon=({d,size=16,stroke='currentColor',fill='none',sw=1.5})=>

  settings:'M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z',

        style:{width:'100%',justifyContent:'center',color:'#FF6B6B',borderColor:'rgba(255,59,59,.2)'},
        onClick:onLogout
      },React.createElement(Icon,{d:ic.logout,size:16,stroke:'#FF6B6B'}),' Logout'),

      React.createElement('p',{style:{textAlign:'center',fontSize:11,color:'var(--text3)'}},'AITube v1.0 · Made for Indian creators')
    )
  );
}

/* ══════════════ DASHBOARD ══════════════ */
function MobileHeader(){
  return React.createElement('header',{className:'mobile-header'},
    React.createElement('div',{className:'mobile-header-logo'},
      React.createElement(Icon,{d:ic.yt,size:22,stroke:'#FF0000',fill:'none',sw:2}),
      React.createElement('span',{className:'ai'},'AI'),
      React.createElement('span',{className:'tube'},'Tube')
    )
  );
}

function Dashboard({user,onLogout}){
  const [tab,setTab]=useState('plan');
  const [showSettings,setShowSettings]=useState(false);

  // Global data cache — all tabs share this
  const [cache,setCache]=useState({});

  function setCache_(key,val){
    setCache(function(prev){var n=Object.assign({},prev);n[key]=val;return n;});
  }

  // Load all tabs in parallel on mount
  useEffect(function(){
    api('/dashboard/plan').then(function(d){setCache_(function(p){return Object.assign({},p,{plan:d});});}).catch(function(){});
    api('/dashboard/analysis').then(function(d){setCache_(function(p){return Object.assign({},p,{analysis:d});});}).catch(function(){});
    api('/dashboard/goal').then(function(d){setCache_(function(p){return Object.assign({},p,{goal:d});});}).catch(function(){});
    api('/dashboard/chat-points').then(function(d){setCache_(function(p){return Object.assign({},p,{chatPoints:d.points});});}).catch(function(){});
  },[]);

  const content={
    plan:React.createElement(PlanTab,{user,preloadedData:cache.plan}),
    analysis:React.createElement(AnalysisTab,{user,preloadedData:cache.analysis}),
    chat:React.createElement(ChatTab,{user,preloadedPoints:cache.chatPoints,preloadedPlan:cache.plan}),
    goal:React.createElement(GoalTab,{user,preloadedData:cache.goal}),
  };
  return React.createElement('div',null,
    React.createElement(Sidebar,{tab,setTab,user,onLogout,onSettings:()=>setShowSettings(true)}),
    React.createElement(MobileHeader),
    React.createElement('div',{className:'main'},content[tab]),
    React.createElement(MobileNav,{tab,setTab,user,onSettings:()=>setShowSettings(true)}),
    showSettings&&React.createElement(SettingsTab,{user,onLogout,onClose:()=>setShowSettings(false)}));
}

/* ══════════════ APP — handles auth state ══════════════ */
function App(){
  const [screen,setScreen]=useState('loading');
  const [user,setUser]=useState(null);

  function verifyAndLogin(tok){
    setToken(tok);
    api('/auth/verify',{method:'POST',body:{token:tok}})
      .then(function(u){
        setUser(u);
        if(!u.onboarded) setScreen('onboard');
        else if(!u.isPremium&&!u.trialActive) setScreen('paywall');
        else setScreen('dashboard');
      })
      .catch(function(){ clearToken(); setScreen('landing'); });
  }

  function extractToken(url){
    if(!url) return null;
    // Handle both tubecoach://callback?token=xxx and https://...?token=xxx
    try {
      var qs=(url.split('?')[1])||'';
      var tok=new URLSearchParams(qs).get('token');
      if(tok) return tok;
      // Try decoding if URL encoded
      var decoded=decodeURIComponent(url);
      qs=(decoded.split('?')[1])||'';
      return new URLSearchParams(qs).get('token');
    } catch(e){ return null; }
  }

  useEffect(()=>{
    var isApp=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform();

    function bootNormal(){
      var params=new URLSearchParams(window.location.search);
      var t=params.get('token');
      if(t){ window.history.replaceState({},'',window.location.pathname); verifyAndLogin(t); return; }
      var saved=getToken();
      if(!saved){ setScreen('landing'); return; }
      api('/auth/verify',{method:'POST',body:{token:saved}})
        .then(function(u){ setUser(u); if(!u.onboarded)setScreen('onboard'); else if(!u.isPremium&&!u.trialActive)setScreen('paywall'); else setScreen('dashboard'); })
        .catch(function(){ clearToken(); setScreen('landing'); });
    }

    function handleDeepLink(url){
      if(!url) return false;
      // Log for debugging
      console.log('[TubeCoach] Deep link received:', url);
      var tok=extractToken(url);
      console.log('[TubeCoach] Token extracted:', tok?'YES':'NO');
      if(tok){
        if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Browser){
          window.Capacitor.Plugins.Browser.close();
        }
        verifyAndLogin(tok);
        return true;
      }
      return false;
    }

    if(isApp&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App){
      var CapApp=window.Capacitor.Plugins.App;

      // Listener for when app is ALREADY RUNNING (foreground/background)
      CapApp.addListener('appUrlOpen',function(event){
        console.log('[TubeCoach] appUrlOpen:', event.url);
        handleDeepLink(event.url||'');
      });

      // Check if app was COLD STARTED via deep link
      CapApp.getLaunchUrl().then(function(result){
        console.log('[TubeCoach] getLaunchUrl:', JSON.stringify(result));
        var launchUrl=result&&result.url?result.url:'';
        if(launchUrl&&!handleDeepLink(launchUrl)){
          bootNormal();
        } else if(!launchUrl){
          bootNormal();
        }
      }).catch(function(e){
        console.log('[TubeCoach] getLaunchUrl error:', e);
        bootNormal();
      });

    } else {
      bootNormal();
    }
  },[]);

  function handleLogin(){
    var isApp=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform();
    if(isApp){
      var loginUrl=API+'/auth/google?state=app';
      if(window.Capacitor.Plugins&&window.Capacitor.Plugins.Browser){
        window.Capacitor.Plugins.Browser.open({
          url:loginUrl,
          presentationStyle:'fullscreen',
          toolbarColor:'#0A0A0A'
        });
      } else {
        window.open(loginUrl,'_blank');
      }
    } else {
      window.location.href=API+'/auth/google';
    }
  }

  function handleLogout(){
    clearToken();setUser(null);setScreen('landing');
  }

  async function handleOnboardDone(){
    const u=await api('/auth/verify',{method:'POST',body:{token:getToken()}});
    setUser(u);setScreen('paywall');
  }

  if(screen==='loading')   return React.createElement(FullLoader,{text:'Loading TubeCoach…'});
  if(screen==='landing')   return React.createElement(Landing,{onLogin:handleLogin,onNewUser:()=>setScreen('guide')});
  if(screen==='guide')     return React.createElement(GuidePage,{onBack:()=>setScreen('landing'),onLogin:handleLogin});
  if(screen==='onboard')   return React.createElement(Onboarding,{user,onDone:handleOnboardDone,user});
  if(screen==='paywall')   return React.createElement(Paywall,{user,onContinue:()=>setScreen('dashboard'),onLogout:handleLogout});
  if(screen==='dashboard') return React.createElement(Dashboard,{user,onLogout:handleLogout});
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>

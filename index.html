<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TubeCoach — Your YouTube Growth Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#FF3B3B;--red-dark:#CC2020;--red-glow:rgba(255,59,59,0.18);
  --bg:#0A0A0A;--bg2:#111111;--bg3:#1A1A1A;--bg4:#222222;
  --text:#F5F5F0;--text2:#A0A09A;--text3:#606058;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --green:#22C55E;--amber:#F59E0B;--blue:#3B82F6;
  --radius:12px;--radius-lg:18px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;overflow-x:hidden}
#root{min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.5}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px var(--red-glow)}50%{box-shadow:0 0 40px var(--red-glow),0 0 80px rgba(255,59,59,0.08)}}
.fade-up{animation:fadeUp .5s ease forwards}
.fade-up-d1{animation:fadeUp .5s .1s ease both}
.fade-up-d2{animation:fadeUp .5s .2s ease both}
.fade-up-d3{animation:fadeUp .5s .3s ease both}
.fade-up-d5{animation:fadeUp .5s .5s ease both}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:var(--radius);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;transition:all .18s ease}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-dark);transform:translateY(-1px)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg4)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-red{background:rgba(255,59,59,.12);color:#FF6B6B;border:1px solid rgba(255,59,59,.2)}
.tag-green{background:rgba(34,197,94,.1);color:#4ADE80;border:1px solid rgba(34,197,94,.2)}
.tag-amber{background:rgba(245,158,11,.1);color:#FCD34D;border:1px solid rgba(245,158,11,.2)}
.tag-blue{background:rgba(59,130,246,.1);color:#60A5FA;border:1px solid rgba(59,130,246,.2)}
.divider{height:1px;background:var(--border);margin:20px 0}
input,textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;width:100%;outline:none;transition:border-color .18s}
input:focus,textarea:focus{border-color:var(--red)}
input::placeholder{color:var(--text3)}
label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.progress-track{background:var(--bg3);border-radius:20px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;background:var(--red);transition:width .6s ease}
.err{background:rgba(255,59,59,.08);border:1px solid rgba(255,59,59,.2);border-radius:var(--radius);padding:14px;font-size:13px;color:#FF6B6B;margin-bottom:16px}
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:fixed;left:0;top:0}
.sidebar-logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:28px;padding:0 8px;display:flex;align-items:center;gap:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text2);transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(255,59,59,.1);color:var(--red);font-weight:500}
.sidebar-bottom{margin-top:auto}
.avatar-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);background:var(--bg3)}
.ava{width:32px;height:32px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.main{margin-left:220px;padding:32px;min-height:100vh;max-width:1100px}
.ph{margin-bottom:32px}
.ph h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:700}
.ph p{color:var(--text2);margin-top:4px;font-size:14px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.slabel{font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.sval{font-family:'Syne',sans-serif;font-size:24px;font-weight:700}
.sdelta{font-size:12px;margin-top:4px}
.sdelta.up{color:var(--green)}.sdelta.down{color:var(--red)}
.aplan{display:grid;grid-template-columns:1fr 320px;gap:20px}
.tlist{display:flex;flex-direction:column;gap:10px}
.titem{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:border-color .15s}
.titem:hover{border-color:var(--border2)}
.titem.done{opacity:.5}
.titem.done .ttitle{text-decoration:line-through}
.tcheck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tcheck.on{background:var(--red);border-color:var(--red)}
.ttitle{font-size:14px;font-weight:500;line-height:1.4}
.tmeta{font-size:12px;color:var(--text3);margin-top:3px}
.msg{display:flex;gap:10px}
.mava{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.mai .mava{background:var(--red);color:#fff}
.muser .mava{background:var(--bg4);color:var(--text2)}
.mbub{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;max-width:calc(100% - 40px)}
.mai .mbub{background:var(--bg3);border:1px solid var(--border)}
.muser .mbub{background:rgba(255,59,59,.12);border:1px solid rgba(255,59,59,.2);margin-left:auto}
.muser{flex-direction:row-reverse}
.cir{display:flex;gap:10px;margin-top:16px}
.cir input{flex:1}
.td{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:pulse 1s ease infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
.owrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.ocard{width:100%;max-width:540px}
.spills{display:flex;gap:6px;margin-bottom:32px}
.spill{height:4px;border-radius:4px;flex:1;background:var(--bg3);transition:background .3s}
.spill.done{background:var(--red)}.spill.act{background:var(--red);opacity:.5}
.land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative;overflow:hidden}
.lglow{position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(255,59,59,.12) 0%,transparent 70%);pointer-events:none}
.land h1{font-family:'Syne',sans-serif;font-size:clamp(36px,6vw,68px);font-weight:800;line-height:1.05;letter-spacing:-2px;margin-bottom:20px}
.land h1 em{font-style:normal;color:var(--red)}
.lsub{font-size:16px;color:var(--text2);max-width:460px;margin:0 auto 36px;line-height:1.7}
.lcard{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:32px;width:100%;max-width:400px;margin:0 auto}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 20px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--text);transition:all .18s}
.gbtn:hover{background:var(--bg4);transform:translateY(-1px)}
.gstep{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.gstep:last-child{border-bottom:none}
.snum{width:28px;height:28px;border-radius:50%;background:rgba(255,59,59,.1);border:1px solid rgba(255,59,59,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--red);flex-shrink:0}
.sectitle{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.ichip{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:8px}
.tbar{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.tbar:last-child{border-bottom:none}
.tbarname{font-size:13px;flex:1}
.tbarscore{font-size:12px;color:var(--text3);width:32px;text-align:right}
.tbartrack{flex:1;max-width:80px;height:4px;background:var(--bg4);border-radius:4px;overflow:hidden}
.tbarfill{height:100%;background:var(--red);border-radius:4px}
.gring{position:relative;width:120px;height:120px;margin:0 auto 20px}
.gring svg{transform:rotate(-90deg)}
.gringlabel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gringpct{font-family:'Syne',sans-serif;font-size:22px;font-weight:700}
.gringsub{font-size:10px;color:var(--text3)}
.barchart{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
.barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;background:var(--bg4)}
.bar.hi{background:var(--red)}
.barlbl{font-size:10px;color:var(--text3)}
.fullload{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.fullload p{color:var(--text2);font-size:14px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var h=React.createElement;
var useState=React.useState;
var useEffect=React.useEffect;
var useRef=React.useRef;

/* ── CONFIG ── change this if your backend URL changes */
var API='https://tubecoach-backend-production.up.railway.app';

/* ── Token helpers ── */
function getToken(){return localStorage.getItem('tc_token');}
function setToken(t){localStorage.setItem('tc_token',t);}
function clearToken(){localStorage.removeItem('tc_token');}

/* ── API helper ── */
function api(path,opts){
  opts=opts||{};
  var token=getToken();
  var headers={'Content-Type':'application/json'};
  if(token) headers['Authorization']='Bearer '+token;
  return fetch(API+path,{
    method:opts.method||'GET',
    headers:headers,
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(res){
    return res.json().then(function(data){
      if(!res.ok) throw new Error(data.error||'Something went wrong');
      return data;
    });
  });
}

/* ── SVG Icon ── */
function Icon(props){
  return h('svg',{width:props.size||16,height:props.size||16,viewBox:'0 0 24 24',fill:props.fill||'none',stroke:props.stroke||'currentColor',strokeWidth:props.sw||1.5,strokeLinecap:'round',strokeLinejoin:'round'},
    h('path',{d:props.d}));
}

var ic={
  plan:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2',
  chat:'M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z',
  chart:'M18 20V10M12 20V4M6 20v-6',
  goal:'M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 8v4l3 3',
  check:'M20 6L9 17l-5-5',
  yt:'M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 00-1.95 1.96A29 29 0 001 12a29 29 0 00.46 5.58 2.78 2.78 0 001.95 1.95C5.12 20 12 20 12 20s6.88 0 8.59-.47a2.78 2.78 0 001.95-1.95A29 29 0 0023 12a29 29 0 00-.46-5.58zM9.75 15.02V8.98l5.75 3.02z',
  spark:'M13 2L3 14h9l-1 8 10-12h-9l1-8',
  trend:'M23 6l-9.5 9.5-5-5L1 18',
  logout:'M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9',
  send:'M22 2L11 13M22 2l-7 20-4-9-9-4 20-7'
};

function FullLoader(props){
  return h('div',{className:'fullload'},
    h('div',{className:'spinner',style:{width:32,height:32,borderWidth:3}}),
    h('p',null,props.text||'Loading...'));
}

/* ══ LANDING ══ */
function Landing(props){
  return h('div',{className:'land'},
    h('div',{className:'lglow'}),
    h('div',{className:'fade-up',style:{marginBottom:12}},
      h('span',{className:'tag tag-red'},h(Icon,{d:ic.spark,size:12}),' AI-Powered Growth')),
    h('h1',{className:'fade-up-d1'},'Grow your YouTube ',h('em',null,'10x faster'),' with AI'),
    h('p',{className:'lsub fade-up-d2'},"India's smartest YouTube growth assistant. Weekly action plan, trend-based video ideas, and an AI coach — all for Rs.499/month."),
    h('div',{className:'lcard fade-up-d3'},
      h('h2',{style:{fontFamily:'Syne',fontSize:18,fontWeight:700,marginBottom:4}},'Get started'),
      h('p',{style:{fontSize:13,color:'var(--text2)',marginBottom:20}},'Login with your Google / YouTube account'),
      h('button',{className:'gbtn',onClick:props.onLogin,style:{marginBottom:12}},
        h('svg',{width:18,height:18,viewBox:'0 0 24 24'},
          h('path',{d:'M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z',fill:'#4285F4'}),
          h('path',{d:'M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z',fill:'#34A853'}),
          h('path',{d:'M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z',fill:'#FBBC05'}),
          h('path',{d:'M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z',fill:'#EA4335'})),
        'Continue with Google'),
      h('div',{style:{height:1,background:'var(--border)',margin:'16px 0'}}),
      h('p',{style:{fontSize:12,color:'var(--text3)',textAlign:'center',marginBottom:12}},"Don't have a YouTube channel yet?"),
      h('button',{className:'btn btn-ghost',style:{width:'100%',justifyContent:'center'},onClick:props.onNewUser},'See how to create one')),
    h('p',{className:'fade-up-d5',style:{marginTop:24,fontSize:12,color:'var(--text3)'}},'7-day free trial · Cancel anytime · Made for Indian creators'));
}

/* ══ GUIDE ══ */
function GuidePage(props){
  var steps=[
    {title:'Go to youtube.com and sign in',desc:'Use your Google account to sign in to YouTube.'},
    {title:'Click your profile icon, then Create a channel',desc:'You will see an option to create a personal or custom-name channel.'},
    {title:'Enter your channel name',desc:'Choose a name that matches your niche. You can change it later.'},
    {title:'Add a profile picture and banner',desc:'Use Canva (free) to create a professional banner in minutes.'},
    {title:'Write your channel description',desc:'Tell viewers what you make, in which language, and how often you post.'},
    {title:'Come back and login with Google',desc:'Once your channel is ready, return here to get your AI growth plan!'}
  ];
  return h('div',{className:'owrap'},
    h('div',{className:'ocard'},
      h('button',{className:'btn btn-ghost',style:{marginBottom:24,fontSize:13},onClick:props.onBack},'Back'),
      h('span',{className:'tag tag-blue',style:{marginBottom:16}},h(Icon,{d:ic.yt,size:12}),' Channel Setup Guide'),
      h('h2',{style:{fontFamily:'Syne',fontSize:24,fontWeight:700,marginBottom:8}},'Create your YouTube channel'),
      h('p',{style:{fontSize:14,color:'var(--text2)',marginBottom:24}},'Follow these steps then come back to login.'),
      h('div',{className:'card',style:{padding:'8px 20px',marginBottom:20}},
        steps.map(function(s,i){
          return h('div',{className:'gstep',key:i},
            h('div',{className:'snum'},i+1),
            h('div',null,
              h('div',{style:{fontSize:14,fontWeight:500,marginBottom:2}},s.title),
              h('div',{style:{fontSize:13,color:'var(--text3)'}},s.desc)));
        })),
      h('button',{className:'btn btn-primary',style:{width:'100%',justifyContent:'center'},onClick:props.onLogin},
        h(Icon,{d:ic.yt,size:16,stroke:'#fff'})," I've created my channel — Login now")));
}

/* ══ ONBOARDING ══ */
function Onboarding(props){
  var stepState=useState(0);
  var step=stepState[0]; var setStep=stepState[1];

  // step 0 = niche description + lang
  // step 1 = AI clarification chat (only if needed)
  // step 2 = goal
  // step 3 = posting frequency
  var formState=useState({nicheDesc:'',lang:'',goal:'',freq:'',goalNumber:10000,nicheResolved:'',clarifications:[]});
  var form=formState[0]; var setForm=formState[1];
  var loadState=useState(false);
  var loading=loadState[0]; var setLoading=loadState[1];
  var errState=useState('');
  var error=errState[0]; var setError=errState[1];

  // Clarification chat state
  var clarifMsgsState=useState([]);
  var clarifMsgs=clarifMsgsState[0]; var setClarifMsgs=clarifMsgsState[1];
  var clarifInputState=useState('');
  var clarifInput=clarifInputState[0]; var setClarifInput=clarifInputState[1];
  var clarifDoneState=useState(false);
  var clarifDone=clarifDoneState[0]; var setClarifDone=clarifDoneState[1];
  var clarifLoadState=useState(false);
  var clarifLoading=clarifLoadState[0]; var setClarifLoading=clarifLoadState[1];

  var langs=['Tamil','Telugu','Hindi','Kannada','Malayalam','English','Bengali'];
  var goals=[
    {l:'1,000 subscribers',n:1000},
    {l:'10,000 subscribers',n:10000},
    {l:'1,00,000 subscribers',n:100000},
    {l:'Monetization (4K hrs + 1K subs)',n:1000},
    {l:'Brand deals',n:10000}
  ];
  var freqs=['1 video/week','2 videos/week','3-4 videos/week','Daily'];

  var totalSteps=4;
  var canNext=(
    (step===0 && form.nicheDesc.trim().length>10 && form.lang) ||
    (step===1 && clarifDone) ||
    (step===2 && form.goal) ||
    (step===3 && form.freq)
  );

  // Step 0 → Step 1: send description to Claude, get clarification question or confirm
  function analyseNiche(){
    setLoading(true); setError('');
    var prompt='A YouTube creator described their niche as: "'+form.nicheDesc+'". '+
      'Analyze this description. If it is specific enough to build a weekly content plan (you understand platform, format, audience, content type), respond with JSON: {"clear":true,"summary":"one line summary of their exact niche"}. '+
      'If something important is ambiguous (like gaming but unclear if PC/mobile/console, or cooking but unclear cuisine type, etc), respond with JSON: {"clear":false,"question":"your single most important clarifying question"}. '+
      'Only ask ONE question maximum. Respond with JSON only, no other text.';
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},

/* ══ COPY BUTTON — standalone component outside TaskGuide ══ */
function CopyBtn(props){
  var copiedState=useState(false);
  var copied=copiedState[0]; var setCopied=copiedState[1];
  function doCopy(e){
    e.stopPropagation();
    if(!props.text) return;
    navigator.clipboard.writeText(String(props.text)).then(function(){
      setCopied(true);
      setTimeout(function(){ setCopied(false); },2000);
    }).catch(function(){
      // fallback for older browsers
      var ta=document.createElement('textarea');
      ta.value=String(props.text);
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(function(){ setCopied(false); },2000);
    });
  }
  return h('button',{
    onClick:doCopy,
    style:{background:copied?'rgba(34,197,94,.15)':'var(--bg4)',border:'1px solid '+(copied?'rgba(34,197,94,.3)':'var(--border2)'),borderRadius:6,padding:'3px 10px',fontSize:11,color:copied?'var(--green)':'var(--text3)',cursor:'pointer',flexShrink:0,whiteSpace:'nowrap',transition:'all .15s'}
  },copied?'✓ Copied':'Copy');
}

  var firstName=(user.name||'').split(' ')[0];

    'Weekly AI action plan with trend-based video ideas',
    'Weekly channel analysis + AI insights',
    'Unlimited AI coach chat (scripts, SEO, thumbnails)',
    'Goal tracker with milestone roadmap',
    'Best time to post for your audience',
    'Competitor channel analysis tips'
  ];
  function go(){
    setLoading(true);
    setTimeout(function(){ setLoading(false); props.onContinue(); },800);
  }
  return h('div',{className:'land'},
    h('div',{className:'lglow'}),
    h('div',{style:{maxWidth:500,width:'100%'}},
      h('div',{className:'fade-up',style:{textAlign:'center',marginBottom:28}},
        h('span',{className:'tag tag-green',style:{marginBottom:14}},h(Icon,{d:ic.spark,size:12}),' 7-day free trial'),
        h('h1',{style:{fontFamily:'Syne',fontSize:32,fontWeight:800,letterSpacing:-1,marginBottom:8}},'Start your free trial'),
        h('p',{style:{color:'var(--text2)',fontSize:15}},'Welcome, '+firstName+'! Your plan is ready.')),
      h('div',{className:'card fade-up-d1'},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}},
          h('div',null,
            h('div',{style:{fontFamily:'Syne',fontSize:28,fontWeight:800}},'Rs.499'),
            h('div',{style:{fontSize:13,color:'var(--text3)'}},'per month · cancel anytime')),
          h('span',{className:'tag tag-red'},'Most popular')),
        features.map(function(f,i){
          return h('div',{key:i,style:{display:'flex',gap:10,marginBottom:12,fontSize:14}},
            h(Icon,{d:ic.check,size:15,stroke:'var(--green)',sw:2.5}),
            h('span',{style:{color:'var(--text2)'}},f));
        }),
        h('button',{className:'btn btn-primary',style:{width:'100%',justifyContent:'center',marginTop:8,padding:'14px',fontSize:15},onClick:go,disabled:loading},
          loading?h('div',{className:'spinner'}):null,
          loading?'Setting up...':'Start 7-day free trial'),
        h('p',{style:{textAlign:'center',fontSize:12,color:'var(--text3)',marginTop:10}},'No charge for 7 days · UPI, Cards, Net banking via Razorpay'))));
}

/* ══ DASHBOARD ══ */
function Dashboard(props){
  var tabState=useState('plan');
  var tab=tabState[0]; var setTab=tabState[1];
  var user=props.user||{};
  var content;
  if(tab==='plan') content=h(PlanTab,{user:user});
  else if(tab==='analysis') content=h(AnalysisTab,null);
  else if(tab==='chat') content=h(ChatTab,{user:user});
  else content=h(GoalTab,null);
  return h('div',null,
    h(Sidebar,{tab:tab,setTab:setTab,user:user,onLogout:props.onLogout}),
    h('div',{className:'main'},content));
}

/* ══ APP ══ */
function App(){
  var screenState=useState('loading');
  var screen=screenState[0]; var setScreen=screenState[1];
  var userState=useState(null);
  var user=userState[0]; var setUser=userState[1];

  useEffect(function(){
    var params=new URLSearchParams(window.location.search);
    var token=params.get('token');
    if(token){
      setToken(token);
      window.history.replaceState({},'',window.location.pathname);
    }
    var saved=getToken();
    if(!saved){ setScreen('landing'); return; }
    api('/auth/verify',{method:'POST',body:{token:saved}})
      .then(function(u){
        setUser(u);
        if(!u.onboarded) setScreen('onboard');
        else if(!u.isPremium&&!u.trialActive) setScreen('paywall');
        else setScreen('dashboard');
      })
      .catch(function(){ clearToken(); setScreen('landing'); });
  },[]);

  function handleLogin(){ window.location.href=API+'/auth/google'; }

  function handleLogout(){ clearToken(); setUser(null); setScreen('landing'); }

  function handleOnboardDone(){
    api('/auth/verify',{method:'POST',body:{token:getToken()}})
      .then(function(u){ setUser(u); setScreen('paywall'); });
  }

  if(screen==='loading')    return h(FullLoader,{text:'Loading TubeCoach...'});
  if(screen==='landing')    return h(Landing,{onLogin:handleLogin,onNewUser:function(){setScreen('guide');}});
  if(screen==='guide')      return h(GuidePage,{onBack:function(){setScreen('landing');},onLogin:handleLogin});
  if(screen==='onboard')    return h(Onboarding,{user:user,onDone:handleOnboardDone});
  if(screen==='paywall')    return h(Paywall,{user:user,onContinue:function(){setScreen('dashboard');}});
  if(screen==='dashboard')  return h(Dashboard,{user:user,onLogout:handleLogout});
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
